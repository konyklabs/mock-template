# NOT YET ENABLED. Publishing to ghcr.io/konyklabs/vendorfake is a Red action
# under the workspace authority model (.claude/rules/agentic-sdlc.md): it goes
# outward, so Oleg approves it separately. This workflow therefore has no
# automatic trigger -- no push, no release, no schedule -- and can only be run
# by a human pressing "Run workflow" and typing the confirmation. Until that
# approval is recorded, treat this file as the *shape* of the publish step,
# verified only as far as `docker build` (tools/verify_image_build.sh).
#
# Inputs never appear inside a `run:` script as `${{ }}`: this job holds
# `packages: write` and a registry login, and a dispatch string interpolated
# into shell text would run whatever it carries. Every input is bound to an
# `env:` variable and read as `"$TAG"`, and the first step refuses anything
# that is not a release tag. The one `${{ inputs.tag }}` left is an *action*
# input (actions/checkout's `ref`), which is data, not shell.
name: publish-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (a release tag such as v0.1.0)"
        required: true
      confirm:
        description: 'Type "publish" to confirm. Publishing is approved by Oleg, not by CI.'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Refuse anything that is not a release tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing tag '$TAG': expected a release tag like v0.1.0" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify the image before it leaves
        run: bash tools/verify_image_build.sh "$IMAGE:$TAG"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
