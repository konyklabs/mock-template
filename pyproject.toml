[project]
name = "vendorfake"
version = "0.3.0"
description = "High-fidelity fakes of third-party vendor APIs: stateful flows, signed webhooks, deterministic fault injection."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oleg Konyk" }]
keywords = ["testing", "fake", "mock", "webhooks", "integration-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# python-multipart is deliberately absent. D-002's original runtime list
# carried it; nothing in this design needs it, and its absence is the
# mechanical proof of the content-type-general invariant. FastAPI requires it
# to read a body even when that body is plain application/x-www-form-urlencoded
# -- a `Form(...)` parameter raises at import time without it and
# `request.form()` raises at request time -- so with it installed a stray
# `await request.form()` in the transport adapter would work perfectly, forever,
# and no gate would notice. Without it, that mistake fails loudly the first time
# it runs. `uv pip show python-multipart` returning non-zero is the check.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jsonschema>=4.18",
  "openapi-schema-validator>=0.6",
  "referencing>=0.30",
  "pyyaml>=6",
  # Declared because vendorfake.testing.transport imports it directly, for the
  # async half of the in-process seam: an `httpx.AsyncClient` is meant to be
  # usable under any anyio backend, so the deliberate `delay_ms` wait is
  # `anyio.sleep` (exercised on asyncio in this suite). Nothing new is
  # installed by this line -- httpx has depended
  # on anyio unconditionally since 0.23 -- but an import we make ourselves is
  # named here rather than inherited, so a future httpx that drops it fails
  # resolution instead of failing at a consumer's first async request.
  "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/konyklabs/vendorfake"
Issues = "https://github.com/konyklabs/vendorfake/issues"

[project.scripts]
vendorfake = "vendorfake.cli:main"
vendorfake-conformance = "vendorfake.conformance.__main__:main"
vendorfake-fidelity = "vendorfake.fidelity.__main__:main"

[project.entry-points."vendorfake.vendors"]
clover = "vendorfake.clover:VENDOR"
square = "vendorfake.square:VENDOR"
toast = "vendorfake.toast:VENDOR"

[project.entry-points.pytest11]
vendorfake_conformance = "vendorfake.conformance.plugin"
vendorfake_fidelity = "vendorfake.fidelity.plugin"
# The consumer-facing fixtures. Registered as an entry point rather than left
# for a consumer's `pytest_plugins` line, because "installed and the fixtures
# are there" is the experience being offered; the module imports nothing
# expensive at load time, so a suite that never requests a fixture pays only
# this module's own small cost. The conformance plugin is deliberately NOT
# registered here -- load it with `-p vendorfake.conformance.plugin` -- so a
# consumer's suite gains no options or session hooks it did not ask for. See
# vendorfake.pytest's docstring for the measurement.
vendorfake = "vendorfake.pytest"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.0",
  "types-jsonschema>=4.18",
  "types-PyYAML>=6",
  # Not used by a single test in this repository directly. It is installed so
  # that tests/unit/test_pytest_plugin_async.py can run a *consumer's* suite
  # under it, in both strict and auto mode, and prove the claim the README
  # makes -- that vendorfake_async_unit works under whichever async runner a
  # consumer already has. anyio's plugin arrives with httpx and covers the
  # other half. Without this the claim would be reasoning, not evidence.
  "pytest-asyncio>=0.23",
]
# The docs site. Kept out of `dev` deliberately: `uv sync` (no group flags,
# what CI's non-docs jobs and a plain contributor checkout run, including
# `uv sync --frozen` in .github/workflows/self-test.yml) has never needed to
# resolve or install a static-site generator to run the tests, and this group
# not existing in that closure is the proof. `tools/self-test.sh`'s docs step
# runs `uv run --group docs mkdocs build --strict`, not plain `uv run`, so
# that one step syncs this group itself regardless of how the caller synced.
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorfake"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "docs/", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests", "tools"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "TID",       # tidy-imports
  "RUF",
]
ignore = [
  "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["vendorfake"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
# `tests/typing` is evidence, not tests: `assert_type` modules that only a type
# checker executes, so they belong in the strict run rather than under the
# `tests.*` override below. It is deliberately not a package (no __init__.py),
# which keeps its modules out of `tests.*` and out of pytest collection.
# `tests/typing/negative` is the half that must FAIL, so the ordinary run must
# not see it; tests/unit/testing/test_seed_typing.py runs mypy on it and
# asserts the error.
files = ["src", "tools", "tests/typing"]
exclude = ["^tests/typing/negative/"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "conformance: a template conformance contract",
  "integration: exercises a running server over HTTP",
]

# ---------------------------------------------------------------------------
# import-linter — the declarative half of the framework-free invariant.
# tools/boundary_check.py is the other half; see docs in that file.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["vendorfake"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core imports no web framework"
type = "forbidden"
source_modules = ["vendorfake.core", "vendorfake.conformance", "vendorfake.fidelity"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "multipart"]

# A contract per vendor is added as each vendor lands; tools/boundary_check.py
# covers vendors from the start through its layer rules, so a vendor is never
# unchecked in the meantime.
